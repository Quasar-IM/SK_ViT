DATA:
  SAMPLE_FRAMES: 32
  SIZE: 256
  CROP_SIZE: 256
  MODALITY: 'SK_MAGA_SKELETON'
  SKELETON_INPUT_TYPE: 'joint'
  SKELETON_ORIG_SIZE: [1280, 720]
  SKELETON_CACHE_ROOT: './data/sk_maga_cache'
  SKELETON_CACHE_SUFFIX: '_sk_maga.npy'
  TRAIN:
    SAMPLER_MODE: 'RANDOMLY'
    DATASET_NAME: iMiGUE_train_full_plus_official_val
  VAL:
    SAMPLER_MODE: 'UNIFORMLY'
    DATASET_NAME: iMiGUE_official_val
  NUM_CLASSES: 32

MODEL:
  TYPE: 'skateformer_micro'
  PRETRAINED: 'SkateFormer_j.pt'
  IN_CHANS: 3
  NUM_POINTS: 24
  NUM_PEOPLE: 1
  DEPTHS: [2, 2, 2, 2]
  CHANNELS: [96, 192, 192, 192]
  EMBED_DIM: 96
  KERNEL_SIZE: 7
  NUM_HEADS: 32
  ATTN_DROP: 0.2
  HEAD_DROP: 0.0
  DROP: 0.0
  REL: True
  DROP_PATH: 0.2
  MLP_RATIO: 4.0
  TYPE_1_SIZE: [4, 6]
  TYPE_2_SIZE: [4, 4]
  TYPE_3_SIZE: [4, 6]
  TYPE_4_SIZE: [4, 4]
  GLOBAL_POOL: 'avg'
  INDEX_T: True
  USE_MEMORY_NECK: True
  MEMORY_FEATURE_DIM: 192
  MEMORY_NUM_CLASSES: 32
  MEMORY_SLOTS_PER_CLASS: 3
  MEMORY_TAU: 10.0
  MEMORY_READ_POS_WEIGHT: 0.0
  MEMORY_READ_NEG_WEIGHT: 1.0

TRAIN:
  LOAD_LATEST: False
  BATCH_SIZE: 16
  EPOCH: 20
  WARM_UP_EPOCH: 5
  SMOOTHING: 0.1
  GRAD_CLIP_NORM: 1.0
  LR: 0.0005
  PRETRAINED_LR_MULT: 0.1
  ADAPTED_PRETRAINED_LR_MULT: 0.2
  NUM_WORKER: 4
  OPTIMIZER: ADAMW
  MOMENTUM: 0.9
  WEIGHT_DECAY: 0.05
  PRINT_INTERVAL: 20
  MEMORY_IB_BETA: 1.0
  MEMORY_KL_WEIGHT: 0.4
  MEMORY_DISTILL_TEMP: 1.0
  MEMORY_WARM_START_EPOCH: 10
  MEMORY_WARM_END_EPOCH: 20
  MEMORY_FORGET_DECAY: 0.1198
  MEMORY_FORGET_MIN: 0.05
  SAVE_EVERY_EPOCH: False
  SAVE_EPOCHS: [5, 10]
  SAVE_EPOCH_RANGE_START: 11
  VAL_EPOCH_INTERVAL: 1
  AMP: False
  SCHEDULER:
    TYPE: warmup_and_cosine
    INITIAL_LR: 0.000001
    MIN_LR: 0.00001
