DATA:
  MEAN:
    - 0.485
    - 0.456
    - 0.406
  STD:
    - 0.229
    - 0.224
    - 0.225
  SAMPLE_FRAMES: 16
  SIZE: 256
  CROP_SIZE: 224
  MODALITY: 'RGB' #RGBD, RGB, Depth
  TRAIN:
    SAMPLER_MODE: 'RANDOMLY'
    DATASET_NAME: iMiGUE_train_full_plus_official_val
  VAL:
    SAMPLER_MODE: 'UNIFORMLY'
    DATASET_NAME: iMiGUE_official_val
  NUM_CLASSES: 32

MODEL:
  PRETRAINED: 'checkpoint.pth'
  PRUNE_LAYERS: [ 6, 9 ]
  PRUNE_KEEP_RATIO: 0.7

TRAIN:
  PROMPT:
    TYPE: []
  BACKBONE_MULTIPLIER: 0.1
  BATCH_SIZE: 8
  EPOCH: 40
  PRUNE_START_EPOCH: 10
  PRUNE_WARM_EPOCH: 15
  WARM_UP_EPOCH: 0
  SMOOTHING: 0.1
  GRAD_CLIP_NORM: 0.1
  LR: 0.00002
  NUM_WORKER: 16
  OPTIMIZER: ADAMW
  MOMENTUM: 0.9
  WEIGHT_DECAY: 0.05
  PRINT_INTERVAL: 10
  SCHEDULER:
    TYPE: cosine
    MIN_LR: 0.000002
  VAL_EPOCH_INTERVAL: 1
  AMP: False
